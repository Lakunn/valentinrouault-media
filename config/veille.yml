# Veille éditoriale de valentinrouault.com : lue chaque jour par scripts/veille.py.
#
# Chaque source a un poids (1 à 3) et une langue. Le score d'un sujet augmente avec le nombre
# de sources distinctes qui en parlent, leur poids et la fraîcheur. Un sujet très couvert en
# anglais et pas encore en français reçoit un bonus « écart FR » : c'est là qu'un article
# français apporte le plus de valeur.
#
# Les flux en erreur sont listés à la fin de chaque rapport : les corriger ou les retirer ici.

days: 7             # fenêtre analysée à chaque passage
history_days: 45    # durée de conservation des éléments (pour détecter les sujets qui montent)
keep_top: 12        # nombre de sujets détaillés dans le rapport

keywords: [seo, référencement, referencement, google, search console, ai overview, aperçus ia, ai mode, mode ia, chatgpt, openai, perplexity, gemini, copilot, bing, llm, geo, core update, spam, crawl, index, schema, robots, serp, backlink, netlinking, e-e-a-t, eeat, discover, merchant, local, maps, agent, llms.txt]
exclude: [webinar, sponsored, sponsorisé, podcast episode, job, recrute, hiring]

feeds:
  # --- Sources officielles (poids 3) ---
  - { name: "Google Search Central (blog)", url: "https://developers.google.com/search/blog/feed.xml", lang: en, weight: 3, type: officiel, filter: false }
  - { name: "Google Search Status Dashboard", url: "https://status.search.google.com/en/feed.atom", lang: en, weight: 3, type: officiel, filter: false }
  - { name: "Google The Keyword : Search", url: "https://blog.google/products/search/rss/", lang: en, weight: 3, type: officiel, filter: false }
  - { name: "Bing Webmaster (blog)", url: "https://blogs.bing.com/webmaster/feed", lang: en, weight: 3, type: officiel, filter: false }
  - { name: "OpenAI (actualités)", url: "https://openai.com/news/rss.xml", lang: en, weight: 2, type: officiel }

  # --- Médias SEO internationaux (poids 2) ---
  - { name: "Search Engine Roundtable", url: "https://www.seroundtable.com/index.rdf", lang: en, weight: 2, type: media, filter: false }
  - { name: "Search Engine Land", url: "https://searchengineland.com/feed", lang: en, weight: 2, type: media, filter: false }
  - { name: "Search Engine Journal", url: "https://www.searchenginejournal.com/feed/", lang: en, weight: 2, type: media, filter: false }
  - { name: "Ahrefs blog", url: "https://ahrefs.com/blog/feed/", lang: en, weight: 2, type: etude }
  - { name: "Semrush blog", url: "https://www.semrush.com/blog/feed/", lang: en, weight: 1, type: etude }
  - { name: "Moz blog", url: "https://moz.com/posts/rss/blog", lang: en, weight: 1, type: etude }
  - { name: "SparkToro", url: "https://sparktoro.com/blog/feed/", lang: en, weight: 2, type: etude }
  - { name: "Growth Memo (Kevin Indig)", url: "https://www.growth-memo.com/feed", lang: en, weight: 2, type: etude }
  - { name: "Aleyda Solis", url: "https://www.aleydasolis.com/en/feed/", lang: en, weight: 1, type: expert }
  - { name: "iPullRank", url: "https://ipullrank.com/feed", lang: en, weight: 1, type: expert }
  - { name: "Google Actualités : Google Search (EN)", url: "https://news.google.com/rss/search?q=%22Google+Search%22+(update+OR+%22AI+Mode%22+OR+%22AI+Overviews%22)&hl=en-US&gl=US&ceid=US:en", lang: en, weight: 1, type: media, filter: false }

  # --- Médias SEO francophones (poids 2) ---
  - { name: "Abondance", url: "https://www.abondance.com/feed", lang: fr, weight: 2, type: media, filter: false }
  - { name: "WebRankInfo", url: "https://www.webrankinfo.com/rss.xml", lang: fr, weight: 2, type: media, filter: false }
  - { name: "Blog du Modérateur", url: "https://www.blogdumoderateur.com/feed/", lang: fr, weight: 1, type: media }
  - { name: "Siècle Digital", url: "https://siecledigital.fr/feed/", lang: fr, weight: 1, type: media }
  - { name: "Journal du Net", url: "https://www.journaldunet.com/rss/", lang: fr, weight: 1, type: media }
  - { name: "Google Actualités : SEO et IA (FR)", url: "https://news.google.com/rss/search?q=(SEO+OR+r%C3%A9f%C3%A9rencement)+(Google+OR+ChatGPT+OR+IA)&hl=fr&gl=FR&ceid=FR:fr", lang: fr, weight: 1, type: media, filter: false }

# Comptes Bluesky (flux RSS officiels : https://bsky.app/profile/<handle>/rss).
# Beaucoup de Googlers et d'experts SEO y publient aussi. Un handle inexact apparaît dans
# « Flux injoignables » : le corriger ici.
bluesky:
  - { handle: "johnmu.com", name: "John Mueller (Google)", weight: 3 }
  - { handle: "rustybrick.com", name: "Barry Schwartz (Search Engine Roundtable)", weight: 2 }
  - { handle: "lilyray.nyc", name: "Lily Ray", weight: 2 }
  - { handle: "aleyda.com", name: "Aleyda Solis", weight: 1 }
  - { handle: "glenngabe.bsky.social", name: "Glenn Gabe", weight: 2 }
  - { handle: "randfish.bsky.social", name: "Rand Fishkin", weight: 1 }

# Alertes Google : dans google.com/alerts, créer l'alerte, « Afficher les options »,
# « Envoyer à : Flux RSS », puis copier ici l'adresse du flux.
google_alerts: []
#  - { name: "Alerte : AI Overviews France", url: "https://www.google.com/alerts/feeds/…/…" }

# Comptes X (Twitter) : suivis uniquement si le secret X_BEARER_TOKEN existe (API payante).
# Sans lui, ces comptes sont couverts indirectement par Search Engine Roundtable, qui relaie
# chaque jour les déclarations des Googlers.
