  - { handle: JohnMu, name: "John Mueller (Google)", weight: 3 }
  - { handle: methode, name: "Gary Illyes (Google)", weight: 3 }
  - { handle: g33konaut, name: "Martin Splitt (Google)", weight: 3 }
  - { handle: googlesearchc, name: "Google Search Central", weight: 3 }
  - { handle: rustybrick, name: "Barry Schwartz", weight: 2 }
  - { handle: lilyraynyc, name: "Lily Ray", weight: 2 }
  - { handle: glenngabe, name: "Glenn Gabe", weight: 2 }
  - { handle: Marie_Haynes, name: "Marie Haynes", weight: 1 }
  - { handle: Kevin_Indig, name: "Kevin Indig", weight: 1 }
  - { handle: randfish, name: "Rand Fishkin", weight: 1 }
  - { handle: aleyda, name: "Aleyda Solis", weight: 1 }
  - { handle: abondance_com, name: "Olivier Andrieu (Abondance)", weight: 2 }
  - { handle: webrankinfo, name: "Olivier Duffez (WebRankInfo)", weight: 2 }

# Sujets suivis : un élément est rattaché au sujet dont il contient un des motifs.
# L'ordre compte (le premier sujet qui correspond l'emporte). Le reste est regroupé par mots communs.
topics:
  - { id: ai-overviews, label: "AI Overviews / Aperçus IA", match: ["ai overview", "aperçus ia", "aperçu ia", "ai overviews"] }
  - { id: ai-mode, label: "Mode IA de Google", match: ["ai mode", "mode ia"] }
  - { id: core-update, label: "Mises à jour de l'algorithme", match: ["core update", "mise à jour principale", "mise à jour de base", "algorithm update"] }
  - { id: spam, label: "Spam et pénalités", match: ["spam update", "spam policy", "site reputation", "scaled content", "pénalité", "manual action"] }
  - { id: search-console, label: "Search Console", match: ["search console"] }
  - { id: chatgpt, label: "ChatGPT et OpenAI", match: ["chatgpt", "openai", "searchgpt", "gpt-"] }
  - { id: gemini, label: "Gemini", match: ["gemini"] }
  - { id: perplexity, label: "Perplexity", match: ["perplexity"] }
  - { id: bing, label: "Bing et Copilot", match: ["bing", "copilot"] }
  - { id: geo, label: "GEO et visibilité dans les IA", match: ["geo ", "generative engine", "llm visibility", "citations", "llms.txt", "ai visibility", "ai search"] }
  - { id: structured-data, label: "Données structurées et résultats enrichis", match: ["structured data", "schema", "rich result", "données structurées"] }
  - { id: local, label: "SEO local", match: ["local seo", "google business profile", "maps", "seo local"] }
  - { id: ecommerce, label: "E-commerce et Merchant Center", match: ["merchant center", "shopping", "product", "e-commerce", "ecommerce"] }
  - { id: discover, label: "Google Discover", match: ["discover"] }
  - { id: technique, label: "SEO technique (crawl, indexation, rendu)", match: ["crawl", "googlebot", "index", "javascript", "core web vitals", "rendering", "robots.txt"] }
  - { id: liens, label: "Liens et netlinking", match: ["backlink", "link building", "netlinking", "links"] }
  - { id: zero-clic, label: "Recherches zéro clic et trafic", match: ["zero-click", "zéro clic", "click-through", "ctr", "traffic drop", "baisse de trafic"] }
