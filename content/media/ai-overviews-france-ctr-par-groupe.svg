<text x="649.5" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#16181d" text-anchor="end">−5,7 %</text>
<text x="40" y="281" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#16181d">Ensemble du panel (médiane)</text>
<text x="40" y="299" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#5d6168">963 domaines</text>
