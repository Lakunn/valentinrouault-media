<text x="40" y="153" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#16181d">Domaines très exposés</text>
<text x="40" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#5d6168">plus de 20 % des requêtes avec AI Overview</text>
<rect x="510.1" y="204" width="191.3" height="26" rx="4" fill="#2f5fdc"/>
<text x="502.1" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#16181d" text-anchor="end">−24,8 %</text>
<text x="40" y="217" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#16181d">Effet net, corrigé du groupe témoin</text>
<text x="40" y="235" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#5d6168">très exposés comparés au groupe témoin</text>
