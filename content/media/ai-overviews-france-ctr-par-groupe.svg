<text x="40" y="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#5d6168">Source : Ahrefs, « AI Overviews Cut CTR by 23.1% in France », 16 septembre 2026 · valentinrouault.com</text>
