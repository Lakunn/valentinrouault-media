<text x="727.2" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#16181d" text-anchor="start">+2,3 %</text>
<text x="40" y="345" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#16181d">Groupe témoin</text>
<text x="40" y="363" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" fill="#5d6168">moins de 2 % des requêtes avec AI Overview</text>
