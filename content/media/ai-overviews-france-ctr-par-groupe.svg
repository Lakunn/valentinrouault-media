<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Évolution du taux de clic : −23,1 % pour les domaines très exposés, −24,8 % d'effet net, −5,7 % pour le panel, +2,3 % pour le groupe témoin">
<rect width="800" height="470" rx="6" fill="#fcfbf8"/>
<rect x="40" y="34" width="44" height="4" rx="2" fill="#2f5fdc"/>
<text x="40" y="74" font-family="'Iowan Old Style', Charter, Cambria, Georgia, serif" font-size="26" font-weight="700" fill="#16181d">Plus un site est exposé, plus son CTR recule</text>
