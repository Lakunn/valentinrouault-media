name: 3 · Contrôle hebdomadaire des URL

# Vérifie chaque lundi que toutes les URL historiques répondent 200 sans redirection.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          WP_URL: ${{ vars.WP_URL }}
        run: python scripts/check_urls.py
