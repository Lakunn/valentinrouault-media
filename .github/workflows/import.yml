name: 1 · Import du site actuel

# Lancement manuel. Récupère les URL et les contenus publiés du site, puis les commite.
# Les fichiers déjà réécrits (origin != import) ne sont jamais écrasés.
on:
  workflow_dispatch:
    inputs:
      urls_only:
        description: "Mettre à jour seulement urls.csv"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import
        env:
          WP_URL: ${{ vars.WP_URL }}
        run: python scripts/wp_import.py ${{ inputs.urls_only && '--urls-only' || '' }}
      - name: Commit
        run: |
          git config user.name "vr-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add urls.csv content
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Import du site actuel ($(date -u +%F))"
          git pull --rebase origin main && git push
