name: 4 · Veille

# Chaque lundi matin : lit les flux de config/veille.yml et commite veille/AAAA-MM-JJ.md.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours couverts"
        default: "8"

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/veille.py --days ${{ inputs.days || '8' }}
      - name: Commit
        run: |
          git config user.name "vr-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veille
          git diff --cached --quiet && exit 0
          git commit -m "Veille du $(date -u +%F)"
          git push
