name: 4 · Veille

# Chaque matin : lit les sources de config/veille.yml, classe les sujets et commite
# veille/AAAA-MM-JJ.md, veille/plan.md et veille/items.json.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours couverts"
        default: "7"

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/veille.py --days ${{ inputs.days || '7' }}
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Commit
        run: |
          git config user.name "vr-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veille
          git diff --cached --quiet && exit 0
          git commit -m "Veille du $(date -u +%F)"
          git pull --rebase origin main && git push
